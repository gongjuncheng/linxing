<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>登录 · 邻星</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <div class="logo">🌙 邻星</div>
        <div class="sub">结交新的好朋友</div>

        <!-- 登录表单 -->
        <div id="login-form">
            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" id="login-email" placeholder="your@email.com" />
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="至少6位" />
            </div>
            <button id="btn-login">登 录</button>
            <div class="link" id="switch-to-register">还没有账号？立即注册</div>
            <div id="status">✨ 登录后即可开始</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';
        import { login, getSession } from './js/auth.js';

        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const loginBtn = document.getElementById('btn-login');
        const switchRegister = document.getElementById('switch-to-register');
        const statusDiv = document.getElementById('status');

        // 如果已经登录，直接跳转
        const session = await getSession();
        if (session) {
            window.location.href = './main.html';
        }

        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || password.length < 6) {
                statusDiv.textContent = '⚠️ 请填写正确的邮箱和密码（≥6位）';
                return;
            }
            statusDiv.textContent = '⏳ 登录中...';
            loginBtn.disabled = true;

            try {
                const { user } = await login(email, password);
                if (!user.confirmed_at) {
                    statusDiv.textContent = '⚠️ 邮箱尚未验证，请先去邮箱点击确认链接';
                    await supabase.auth.signOut();
                    return;
                }
                statusDiv.textContent = '✅ 登录成功！';
                window.location.href = './main.html';
            } catch (error) {
                if (error.message.includes('Email not confirmed')) {
                    statusDiv.textContent = '⚠️ 邮箱尚未验证，请先去邮箱点击确认链接';
                } else if (error.message.includes('Invalid login credentials')) {
                    statusDiv.textContent = '❌ 邮箱或密码错误，请重试';
                } else {
                    statusDiv.textContent = '❌ ' + error.message;
                }
            } finally {
                loginBtn.disabled = false;
            }
        });

        switchRegister.addEventListener('click', () => {
            window.location.href = './register.html';
        });

        // 回车键登录
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });
    </script>
</body>
</html>
