<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>个人设置 · 邻星</title>
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #fdf8f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }
        #app {
            background: white;
            max-width: 440px;
            width: 100%;
            padding: 24px 20px;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin: 20px 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0ebe5;
            margin-bottom: 20px;
        }
        .header .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #d4836c;
            padding: 0 4px;
            width: auto;
            margin: 0;
        }
        .header .title {
            font-size: 18px;
            font-weight: 600;
            color: #4a3f38;
        }
        .header .spacer {
            width: 32px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #4a3f38;
            margin-bottom: 4px;
        }
        input,
        select {
            width: 100%;
            padding: 11px 16px;
            border: 1.5px solid #eee;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #fafaf8;
            appearance: auto;
        }
        input:focus,
        select:focus {
            border-color: #d4836c;
            background: #fff;
        }
        .row-3 {
            display: flex;
            gap: 10px;
        }
        .row-3>* {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            background: #d4836c;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background: #c2725b;
        }
        button.secondary {
            background: #ccc;
            color: #555;
        }
        button.secondary:hover {
            background: #bbb;
        }
        #status {
            margin-top: 16px;
            color: #b0a094;
            font-size: 14px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .avatar-placeholder {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #d4836c22;
            color: #d4836c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .avatar-section .info {
            font-size: 14px;
            color: #b0a094;
        }
        .avatar-section .info strong {
            color: #4a3f38;
        }
    </style>
</head>
<body>

        <div class="header">
            <button class="back-btn" id="back-btn">‹</button>
            <span class="title">⚙️ 个人设置</span>
            <span class="spacer"></span>
        </div>

        <!-- 表单 -->

        </div>
        <div class="form-group">

            <div style="font-size:12px;color:#b0a094;margin-top:4px;">修改后可能影响好友搜索，请谨慎操作</div>
        </div>
        <div class="form-group">
            <label>出生日期</label>
            <div class="row-3">
                <input type="number" id="birth-year" placeholder="年" min="1900" max="2099" />

                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                </select>
                <select id="birth-day">
                    <option value="">日</option>
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                    <option value="13">13</option><option value="14">14</option><option value="15">15</option>
                    <option value="16">16</option><option value="17">17</option><option value="18">18</option>
                    <option value="19">19</option><option value="20">20</option><option value="21">21</option>
                    <option value="22">22</option><option value="23">23</option><option value="24">24</option>
                    <option value="25">25</option><option value="26">26</option><option value="27">27</option>
                    <option value="28">28</option><option value="29">29</option><option value="30">30</option>
                    <option value="31">31</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>所在地区</label>
            <select id="country">
                <option value="">请选择国家</option>
                <option value="中国">中国</option>
                <option value="美国">美国</option>
                <option value="英国">英国</option>
                <option value="日本">日本</option>
                <option value="韩国">韩国</option>
                <option value="法国">法国</option>
                <option value="德国">德国</option>
                <option value="加拿大">加拿大</option>
                <option value="澳大利亚">澳大利亚</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-group hidden" id="province-group">
            <label>省份</label>
            <select id="province">
                <option value="">请选择省份</option>
            </select>
        </div>
        <div class="form-group hidden" id="city-group">
            <label>城市</label>
            <select id="city">
                <option value="">请选择城市</option>

        </div>

        <div id="status"></div>
    </div>

            "青海省": ["西宁市", "海东市", "海北藏族自治州", "黄南藏族自治州", "海南藏族自治州", "果洛藏族自治州", "玉树藏族自治州", "海西蒙古族藏族自治州"],

            "新疆维吾尔自治区": ["乌鲁木齐市", "克拉玛依市", "吐鲁番市", "哈密市", "昌吉回族自治州", "博尔塔拉蒙古自治州", "巴音郭楞蒙古自治州", "阿克苏地区", "克孜勒苏柯尔克孜自治州", "喀什地区", "和田地区", "伊犁哈萨克自治州", "塔城地区", "阿勒泰地区", "石河子市", "阿拉尔市", "图木舒克市", "五家渠市", "北屯市", "铁门关市", "双河市", "可克达拉市", "昆玉市", "胡杨河市"],
            "台湾省": ["台北市", "高雄市", "台中市", "台南市", "基隆市", "新竹市", "嘉义市", "新北市", "桃园市", "苗栗县", "彰化县", "南投县", "云林县", "嘉义县", "屏东县", "宜兰县", "花莲县", "台东县", "澎湖县", "金门县", "连江县"],

        // ===== DOM 引用 =====
        const backBtn = document.getElementById('back-btn');
        const displayNameInput = document.getElementById('display-name');
        const usernameInput = document.getElementById('username');
        const birthYear = document.getElementById('birth-year');
        const birthMonth = document.getElementById('birth-month');
        const birthDay = document.getElementById('birth-day');
        const countrySelect = document.getElementById('country');
        const provinceSelect = document.getElementById('province');
        const citySelect = document.getElementById('city');
        const provinceGroup = document.getElementById('province-group');
        const cityGroup = document.getElementById('city-group');
        const saveBtn = document.getElementById('save-btn');
        const statusDiv = document.getElementById('status');
        const avatarPlaceholder = document.getElementById('avatar-placeholder');
        const displayNameLabel = document.getElementById('display-name-label');
        const userIdLabel = document.getElementById('user-id-label');

        // ===== 当前用户 =====
        let currentUser = null;
        let currentProfile = null;

        // ===== 初始化省份下拉 =====
        function populateProvinces() {
            const provinces = Object.keys(chinaData);
            provinceSelect.innerHTML = '<option value="">请选择省份</option>';
            provinces.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                provinceSelect.appendChild(opt);
            });
            citySelect.innerHTML = '<option value="">请先选择省份</option>';
            cityGroup.classList.add('hidden');
        }
        populateProvinces();

        // ===== 省份 -> 城市联动 =====
        provinceSelect.addEventListener('change', () => {
            const province = provinceSelect.value;
            if (!province || !chinaData[province]) {
                citySelect.innerHTML = '<option value="">请先选择省份</option>';
                cityGroup.classList.add('hidden');
                return;
            }
            citySelect.innerHTML = '<option value="">请选择城市</option>';
            chinaData[province].forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                citySelect.appendChild(opt);
            });
            cityGroup.classList.remove('hidden');
        });

        // ===== 国家切换显示省份 =====
        countrySelect.addEventListener('change', () => {
            if (countrySelect.value === '中国') {
                provinceGroup.classList.remove('hidden');
                populateProvinces();
            } else {
                provinceGroup.classList.add('hidden');
                cityGroup.classList.add('hidden');
                provinceSelect.value = '';
                citySelect.innerHTML = '<option value="">请先选择省份</option>';
            }
        });

        // ===== 加载用户资料 =====
        async function loadProfile() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                // 未登录，跳回主页
                window.location.href = '/index.html';
                return;
            }
            currentUser = session.user;

            // 查询 profiles
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (error) {
                console.error('加载资料失败:', error);
                statusDiv.textContent = '加载资料失败，请刷新重试';
                return;
            }
            currentProfile = data;

            // 填充表单
            displayNameInput.value = data.display_name || '';
            usernameInput.value = data.username || '';
            // 头像占位
            const initial = (data.display_name || data.username || '?')[0];
            avatarPlaceholder.textContent = initial;
            displayNameLabel.textContent = data.display_name || data.username || '未设置';
            userIdLabel.textContent = `ID: ${data.username} · No.${data.user_no}`;

            // 生日
            if (data.birthday) {
                const parts = data.birthday.split('-');
                if (parts.length === 3) {
                    birthYear.value = parts[0];
                    birthMonth.value = parseInt(parts[1]);
                    birthDay.value = parseInt(parts[2]);
                }
            }

            // 地区：解析 location 字符串（格式如 "中国 广东省 广州市"）
            if (data.location) {
                const parts = data.location.split(' ');
                if (parts.length >= 1) {
                    const country = parts[0];
                    countrySelect.value = country;
                    if (country === '中国' && parts.length >= 2) {
                        provinceGroup.classList.remove('hidden');
                        populateProvinces();
                        const province = parts[1];
                        provinceSelect.value = province;
                        // 触发城市加载
                        if (province && chinaData[province]) {
                            citySelect.innerHTML = '<option value="">请选择城市</option>';
                            chinaData[province].forEach(c => {
                                const opt = document.createElement('option');
                                opt.value = c;
                                opt.textContent = c;
                                citySelect.appendChild(opt);
                            });
                            cityGroup.classList.remove('hidden');
                            if (parts.length >= 3) {
                                citySelect.value = parts[2];
                            }
                        }
                    }
                }
            }
        }

        // ===== 保存资料 =====
        saveBtn.addEventListener('click', async () => {
            const displayName = displayNameInput.value.trim();
            const username = usernameInput.value.trim();
            const year = birthYear.value.trim();
            const month = birthMonth.value;
            const day = birthDay.value;
            const country = countrySelect.value;
            const province = provinceSelect.value;
            const city = citySelect.value;

            // 验证
            if (!displayName) {
                statusDiv.textContent = '⚠️ 昵称不能为空';
                return;
            }
            if (!username) {
                statusDiv.textContent = '⚠️ 自定义ID不能为空';
                return;
            }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                statusDiv.textContent = '⚠️ 自定义ID只能包含字母、数字、下划线';
                return;
            }

            // 日期验证
            let birthday = null;
            if (year && month && day) {
                const y = parseInt(year),
                    m = parseInt(month),
                    d = parseInt(day);
                if (isNaN(y) || y < 1900 || y > 2099 || isNaN(m) || m < 1 || m > 12 || isNaN(d) || d < 1 || d > 31) {
                    statusDiv.textContent = '⚠️ 请填写完整有效的出生日期';
                    return;
                }
                const dateObj = new Date(y, m - 1, d);
                if (dateObj.getFullYear() !== y || dateObj.getMonth() !== m - 1 || dateObj.getDate() !== d) {
                    statusDiv.textContent = '⚠️ 日期不合法（如2月30日）';
                    return;
                }
                birthday = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            }

            // 地区拼接
            let location = '';
            if (country) {
                location = country;
                if (country === '中国' && province) {
                    location += ' ' + province;
                    if (city) location += ' ' + city;
                }
            }

            // 检查 username 唯一性（如果修改了）
            if (username !== currentProfile.username) {
                const { data: existing, error: checkError } = await supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .maybeSingle();
                if (existing) {
                    statusDiv.textContent = '⚠️ 这个ID已被占用，请换一个';
                    return;
                }
            }

            // 更新
            const { error } = await supabase
                .from('profiles')
                .update({
                    display_name: displayName,
                    username: username,
                    birthday: birthday,
                    location: location
                })
                .eq('id', currentUser.id);

            if (error) {
                statusDiv.textContent = '❌ 保存失败：' + error.message;
                return;
            }

            // 更新 user_metadata 中的 display_name（方便主界面显示）
            await supabase.auth.updateUser({
                data: { display_name: displayName }
            });

            statusDiv.textContent = '✅ 资料保存成功！';
            // 更新显示
            displayNameLabel.textContent = displayName;
            avatarPlaceholder.textContent = displayName[0];
            userIdLabel.textContent = `ID: ${username} · No.${currentProfile.user_no}`;

            // 刷新当前 profile 缓存
            currentProfile.display_name = displayName;
            currentProfile.username = username;
            currentProfile.birthday = birthday;
            currentProfile.location = location;
        });

        // ===== 返回 =====
        backBtn.addEventListener('click', () => {
            window.location.href = '/index.html';
        });

        // ===== 启动 =====
        loadProfile();
    </script>
</body>
  </html>
