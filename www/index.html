// ===== 好友列表 =====
async function loadFriends(){console.log('加载好友列表');
const{data:{user}}=await supabase.auth.getUser();if(!user)return;
const{data:friendsData}=await supabase.from('friends').select('user_id,friend_id').eq('status','accepted').or(`user_id.eq.${user.id},friend_id.eq.${user.id}`);
if(!friendsData||friendsData.length===0){els.friendsList.innerHTML='<div class="empty-tip">还没有好友，点击 ➕ 添加</div>';return;}
const friendIds=friendsData.map(f=>f.user_id===user.id?f.friend_id:f.user_id);
const{data:profiles}=await supabase.from('profiles').select('id,display_name,username,avatar_url,location,user_no').in('id',friendIds);
if(!profiles||profiles.length===0){els.friendsList.innerHTML='<div class="empty-tip">还没有好友，点击 ➕ 添加</div>';return;}
let html='';profiles.forEach(f=>{const av=f.avatar_url?`<img src="${f.avatar_url}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">`:`<div class="user-avatar">${(f.display_name||f.username||'?')[0]}</div>`;html+=`<div class="user-row" onclick="window.openChat('${f.id}')"><div class="user-info">${av}<div><div class="user-name">${f.display_name||f.username}</div><div class="user-id">ID: ${f.username} · No.${f.user_no}</div>${f.location?`<div class="user-location">📍 ${f.location}</div>`:''}</div></div><span style="color:#7bc0a4;font-size:13px;">💬 聊天</span></div>`;});els.friendsList.innerHTML=html;}
window.openChat=async function(friendId){console.log('打开聊天',friendId);const{data:{user}}=await supabase.auth.getUser();if(!user)return;const{data}=await supabase.from('profiles').select('id,display_name,username,avatar_url').eq('id',friendId).single();if(data)showChat(data,user);};

// ===== 消息相关 =====
function appendMessage(msg,currentUserId){console.log('appendMessage',msg.id);
const existing=els.chatMessages.querySelector(`[data-msg-id="${msg.id}"]`);if(existing)return;
const div=document.createElement('div');div.className=`msg ${msg.from_user_id===currentUserId?'sent':'received'}`;div.dataset.msgId=msg.id;
const time=new Date(msg.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
let contentHtml=msg.content||'';if(msg.is_burn&&msg.from_user_id===currentUserId)contentHtml+=`<span class="burn-badge">🔥 ${msg.burn_seconds}s</span>`;
if(msg.is_read&&msg.from_user_id!==currentUserId)contentHtml+=`<span class="read-status">✓ 已读</span>`;
div.innerHTML=`${contentHtml}<span class="time">${time}</span>`;
els.chatMessages.insertBefore(div,els.typingBubble);els.typingBubble.classList.add('hidden');clearTimeout(typingTimeout);}

function appendStickerMessage(sticker,currentUserId){console.log('appendStickerMessage',sticker.id);
const existing=els.chatMessages.querySelector(`[data-sticker-id="${sticker.id}"]`);if(existing)return;
const div=document.createElement('div');div.className=`msg ${sticker.from_user_id===currentUserId?'sent':'received'} sticker`;div.dataset.stickerId=sticker.id;
const time=new Date(sticker.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
div.innerHTML=`<span class="sticker-label">📝 小纸条</span>${sticker.content}<span class="time">${time}</span>`;
els.chatMessages.insertBefore(div,els.typingBubble);els.typingBubble.classList.add('hidden');clearTimeout(typingTimeout);}

function appendMediaMessage(msg,currentUserId,expired){console.log('appendMediaMessage',msg.id,expired);
const existing=els.chatMessages.querySelector(`[data-msg-id="${msg.id}"]`);if(existing)return;
const div=document.createElement('div');div.className=`msg ${msg.from_user_id===currentUserId?'sent':'received'} media`;div.dataset.msgId=msg.id;
const time=new Date(msg.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
let mediaHtml='';if(expired||(msg.media_type==='video'&&isVideoExpired(msg.created_at))){mediaHtml=`<div class="media-expired"><div class="icon">📎</div><span>文件已过期</span></div>`;}else if(msg.media_type==='image'){mediaHtml=`<img src="${msg.media_url}" alt="图片" onclick="window.previewImage('${msg.media_url}')" />`;}else if(msg.media_type==='video'){mediaHtml=`<video controls preload="metadata"><source src="${msg.media_url}" /></video>`;}
div.innerHTML=mediaHtml+`<span class="time">${time}</span>`;
els.chatMessages.insertBefore(div,els.typingBubble);els.typingBubble.classList.add('hidden');clearTimeout(typingTimeout);}

function isVideoExpired(createdAt){return Date.now()-new Date(createdAt).getTime()>7*24*60*60*1000;}
window.previewImage=function(url){els.previewImage.src=url;els.previewOverlay.classList.remove('hidden');};
els.previewClose.addEventListener('click',()=>els.previewOverlay.classList.add('hidden'));
els.previewOverlay.addEventListener('click',(e)=>{if(e.target===els.previewOverlay)els.previewOverlay.classList.add('hidden');});

// ===== 加载消息 =====
async function loadMessages(friendId){console.log('加载消息',friendId);
const{data:{user}}=await supabase.auth.getUser();if(!user)return;
const [msgRes,stickerRes]=await Promise.all([
supabase.from('messages').select('*').or(`and(from_user_id.eq.${user.id},to_user_id.eq.${friendId}),and(from_user_id.eq.${friendId},to_user_id.eq.${user.id})`).order('created_at',{ascending:true}),
supabase.from('stickers').select('*').or(`and(from_user_id.eq.${user.id},to_user_id.eq.${friendId}),and(from_user_id.eq.${friendId},to_user_id.eq.${user.id})`).order('created_at',{ascending:true})
]);
els.chatMessages.innerHTML='';els.chatMessages.appendChild(els.typingBubble);
const all=[...(msgRes.data||[]),...(stickerRes.data||[]).map(s=>({...s,is_sticker:true}))];
all.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
all.forEach(item=>{if(item.is_sticker)appendStickerMessage(item,user.id);else if(item.media_url)appendMediaMessage(item,user.id,false);else appendMessage(item,user.id);});
els.chatMessages.scrollTop=els.chatMessages.scrollHeight;}

// ===== 阅后即焚 =====
async function loadBurnAgreement(friendId){console.log('加载阅后即焚约定',friendId);
const{data:{user}}=await supabase.auth.getUser();if(!user)return null;
const{data}=await supabase.from('burn_agreements').select('*').or(`user_id.eq.${user.id},friend_id.eq.${user.id}`).eq('friend_id',friendId).maybeSingle();
console.log('约定数据',data);return data||null;}
function updateBurnStatusLabel(agreement){console.log('更新阅后即焚状态',agreement);
if(!agreement){els.burnStatusLabel.textContent='';return;}
const map={pending:'⏳ 等待对方同意',accepted:`🔥 阅后即焚 (${agreement.burn_seconds}s)`,rejected:'❌ 已拒绝',revoked:'↩️ 已撤销'};
els.burnStatusLabel.textContent=map[agreement.status]||'';}
async function sendBurnAgreement(friendId,seconds){console.log('发送阅后即焚约定',friendId,seconds);
const{data:{user}}=await supabase.auth.getUser();if(!user)return;
const existing=await loadBurnAgreement(friendId);
if(existing){if(existing.status==='pending'){els.burnStatus.textContent='⏳ 已有待同意的约定';return;}if(existing.status==='accepted'){els.burnStatus.textContent='🔥 已有生效的约定';return;}}
const{error}=await supabase.from('burn_agreements').upsert({user_id:user.id,friend_id:friendId,burn_seconds:seconds,status:'pending'},{onConflict:'user_id, friend_id'});

function subscribeToTypingAndMessages(friendId,currentUser){console.log('订阅广播',friendId);
if(typingChannel){typingChannel.unsubscribe();typingChannel=null;}
if(typingInputHandler){els.chatInput.removeEventListener('input',typingInputHandler);typingInputHandler=null;}
const user=currentUser;if(!user)return;
const ids=[user.id,friendId].sort();const shortIds=ids.map(id=>id.slice(0,8));const channelName=`typing-${shortIds[0]}-${shortIds[1]}`;
console.log('频道名',channelName);
typingChannel=supabase.channel(channelName);
typingChannel.on('broadcast',{event:'typing'},({payload})=>{console.log('收到打字',payload);if(payload.sender===user.id)return;if(payload.content&&payload.content.length>0){els.typingBubble.textContent='✍️ '+payload.content;els.typingBubble.classList.remove('hidden');clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>els.typingBubble.classList.add('hidden'),5000);}else{els.typingBubble.classList.add('hidden');clearTimeout(typingTimeout);}});
typingChannel.on('broadcast',{event:'new_message'},async({payload})=>{console.log('收到新消息',payload);const{data:{user:cu}}=await supabase.auth.getUser();if(!cu)return;if(payload.from_user_id===cu.id)return;if(payload.to_user_id!==cu.id&&payload.from_user_id!==cu.id)return;const{data:msg}=await supabase.from('messages').select('*').eq('id',payload.message_id).single();if(msg){if(msg.media_url)appendMediaMessage(msg,cu.id,false);else appendMessage(msg,cu.id);els.chatMessages.scrollTop=els.chatMessages.scrollHeight;}});
typingChannel.on('broadcast',{event:'new_sticker'},async({payload})=>{console.log('收到小纸条',payload);const{data:{user:cu}}=await supabase.auth.getUser();if(!cu)return;if(payload.from_user_id===cu.id)return;if(payload.to_user_id!==cu.id&&payload.from_user_id!==cu.id)return;const{data:sticker}=await supabase.from('stickers').select('*').eq('id',payload.sticker_id).single();if(sticker){appendStickerMessage(sticker,cu.id);els.chatMessages.scrollTop=els.chatMessages.scrollHeight;}});
typingChannel.on('broadcast',{event:'burn_agreement_update'},async({payload})=>{console.log('收到阅后即焚更新',payload);await handleBurnAgreementUpdate(payload);});

if(!requests||requests.length===0){els.modalRequestsList.innerHTML='<div class="empty-tip">🎉 暂无好友请求</div>';return;}
const senderIds=requests.map(r=>r.user_id);const{data:profiles}=await supabase.from('profiles').select('id,display_name,username,avatar_url,location,user_no').in('id',senderIds);

window.handleRequest=async function(id,action){console.log('处理好友请求',id,action);
if(action==='accept'){await supabase.from('friends').update({status:'accepted'}).eq('id',id);alert('✅ 已同意好友请求！');}else{await supabase.from('friends').delete().eq('id',id);alert('已拒绝该请求');}

it:cover;">`:`<div class="user-avatar">${(u.display_name||u.username||'?')[0]}</div>`;html+=`<div class="result-item"><div class="user-info">${av}<div><div class="user-name">${u.display_name||u.username}</div><div class="user-id">ID: ${u.username} · No.${u.user_no}</div>${u.location?`<div class="user-location">📍 ${u.location}</div>`:''}</div></div><div>${actionHtml}</div></div>`;});els.modalResults.innerHTML=html;});

const{data:{user}}=await supabase.auth.getUser();if(!user){alert('请先登录');return;}if(user.id===targetId){alert('不能添加自己');return;}const{data:existing}=await supabase.from('friends').select('id,status').or(`and(user_id.eq.${user.id},friend_id.eq.${targetId}),and(user_id.eq.${targetId},friend_id.eq.${user.id})`).maybeSingle();if(existing){if(existing.status==='accepted'){alert('已经是好友了');return;}if(existing.status==='pending'){alert('已发送过请求，请等待对方处理');return;}if(existing.status==='rejected'){await supabase.from('friends').update({status:'pending'}).eq('id',existing.id);alert('✅ 已重新发送好友请求！');els.modalSearchBtn.click();loadModalRequests();updateBadge();return;}}const{error}=await supabase.from('friends').insert({user_id:user.id,friend_id:targetId,status:'pending'});if(error){alert('发送失败:'+error.message);return;}alert('✅ 好友请求已发送！');els.modalSearchBtn.click();loadModalRequests();updateBadge();};

els.registerBtn.addEventListener('click',async()=>{console.log('注册');
if(!els.agreeCheckbox.checked){els.agreeError.style.display='block';els.registerStatus.textContent='';return;}els.agreeError.style.display='none';
const email=els.regEmail.value.trim(),password=els.regPassword.value.trim(),displayName=els.regDisplayName.value.trim(),username=els.regUsername.value.trim(),year=els.regYear.value.trim(),month=els.regMonth.value,day=els.regDay.value,country=els.regCountry.value,province=els.regProvince.value,city=els.regCity.value;let location='';if(country){location=country;if(country==='中国'&&province){location+=' '+province;if(city)location+=' '+city;}}if(!email||password.length<6){els.registerStatus.textContent='⚠️ 邮箱和密码（≥6位）必填';return;}if(!displayName){els.registerStatus.textContent='⚠️ 请填写昵称';return;}if(!username){els.registerStatus.textContent='⚠️ 请填写自定义ID';return;}if(!/^[a-zA-Z0-9_]+$/.test(username)){els.registerStatus.textContent='⚠️ 自定义ID只能包含字母、数字、下划线';return;}const y=parseInt(year),m=parseInt(month),d=parseInt(day);if(isNaN(y)||y<1900||y>2099||isNaN(m)||m<1||m>12||isNaN(d)||d<1||d>31){els.registerStatus.textContent='⚠️ 请填写完整有效的出生日期';return;}const dateObj=new Date(y,m-1,d);if(dateObj.getFullYear()!==y||dateObj.getMonth()!==m-1||dateObj.getDate()!==d){els.registerStatus.textContent='⚠️ 日期不合法';return;}const birthday=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const{data:existing}=await supabase.from('profiles').select('username').eq('username',username).maybeSingle();if(existing){els.registerStatus.textContent='⚠️ 这个ID已被占用，请换一个';return;}els.registerStatus.textContent='⏳ 发送验证邮件...';els.registerBtn.disabled=true;const{data,error}=await supabase.auth.signUp({email,password,options:{data:{display_name:displayName,username:username,birthday:birthday,location:location}}});if(error){els.registerStatus.textContent='❌ 注册失败：'+error.message;els.registerBtn.disabled=false;return;}const user=data.user;if(!user){els.registerStatus.textContent='⚠️ 该邮箱可能已注册，请直接登录';els.registerBtn.disabled=false;return;}await supabase.from('profiles').upsert({id:user.id,display_name:displayName,username:username,birthday:birthday,location:location},{onConflict:'id'});els.regEmail.value='';els.regPassword.value='';els.regDisplayName.value='';els.regUsername.value='';els.regYear.value='';els.regMonth.value='';els.regDay.value='';els.regCountry.value='';els.regProvince.value='';els.regCity.innerHTML='<option value="">请先选择省份</option>';els.cityGroup.classList.add('hidden');els.provinceGroup.classList.add('hidden');els.agreeCheckbox.checked=false;els.registerStatus.textContent='📧 验证邮件已发送，请确认后登录';els.registerBtn.disabled=false;showLogin();els.status.textContent='📧 验证邮件已发送，请确认后登录';});
els.switchRegister.addEventListener('click',showRegister);
els.switchLogin.addEventListener('click',showLogin);
els.logoutBtn.addEventListener('click',async()=>{console.log('退出');await supabase.auth.signOut();if(typingChannel)typingChannel.unsubscribe();if(typingInputHandler)els.chatInput.removeEventListener('input',typingInputHandler);hideChat();showLogin();els.status.textContent='👋 已退出';});
document.addEventListener('keydown',(e)=>{if(e.key==='Enter'){if(!els.loginMode.classList.contains('hidden'))els.loginBtn.click();else if(!els.registerMode.classList.contains('hidden'))els.registerBtn.click();else if(!els.modal.classList.contains('hidden')&&document.activeElement===els.modalSearchInput)els.modalSearchBtn.click();else if(!els.chatView.classList.contains('hidden')&&document.activeElement===els.chatInput)els.chatSendBtn.click();}});
setInterval(()=>{if(!els.mainBox.classList.contains('hidden'))updateBadge();},10000);

checkSession();
console.log('✅ 应用已完全启动');
</script>
</body>
</html>
