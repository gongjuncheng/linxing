name: 自动打包 APK（含图标和签名）

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码 (v3 -> v4)
      - uses: actions/checkout@v4

      # 2. 安装 Node.js (v3 -> v4)
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      # 3. 生成自定义图标
      - name: 生成应用图标
        run: |
          npm install @capacitor/assets
          npx capacitor-assets generate --iconBackgroundColor '#fdf8f0' --splashBackgroundColor '#fdf8f0'

      # 4. 初始化 Capacitor 并添加安卓
      - name: 初始化 Capacitor
        run: |
          npx cap init 邻星 com.linxing.app --web-dir=www
          npx cap add android

      - name: 同步代码
        run: npx cap sync

      # 5. 注入签名配置
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          sed -i '/android {/a \
              signingConfigs {\
                  release {\
                      storeFile file("keystore.jks")\
                      storePassword System.getenv("KEYSTORE_PASSWORD")\
                      keyAlias System.getenv("KEY_ALIAS")\
                      keyPassword System.getenv("KEY_PASSWORD")\
                  }\
              }' android/app/build.gradle
          sed -i '/release {/a \
                  signingConfig signingConfigs.release' android/app/build.gradle

      # 6. 安装 JDK 17 (v3 -> v4)
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 7. 构建 APK
      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 8. 上传 APK (这个你之前已经是 v4 了，不用改)
      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: 邻星安装包（带签名）
          path: android/app/build/outputs/apk/release/app-release.apk
