name: 自动打包 APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 安装 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      - name: 初始化 Capacitor 并添加安卓
        run: |
          npx cap init 邻星 com.linxing.app --web-dir=www
          npx cap add android

      - name: 同步代码
        run: npx cap sync

      - name: 安装 JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4   # ← 这里从 v3 改成了 v4
        with:
          name: 邻星安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
