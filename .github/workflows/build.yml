name: 自动打包 APK（签名注入）

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 同一分支只保留最后一次运行，避免连续提交触发大量重复任务
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      - name: 同步 Web 资源到原生工程
        run: npx cap sync android

      # -------- 生成自定义图标（仅当存在 resources/icon.png 时） --------
      - name: 生成自定义图标
        run: |
          if [ -f "resources/icon.png" ]; then
            echo "✅ 找到 resources/icon.png，生成图标..."
            mkdir -p assets
            cp resources/icon.png assets/icon.png
            npm install @capacitor/assets
            npx capacitor-assets generate --iconBackgroundColor '#fdf8f0' --splashBackgroundColor '#fdf8f0'
          else
            echo "ℹ️ 未找到 resources/icon.png，使用 Capacitor 默认图标。"
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 解码 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: 构建 APK（签名注入）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 邻星安装包（带签名）
          path: android/app/build/outputs/apk/release/app-release.apk
