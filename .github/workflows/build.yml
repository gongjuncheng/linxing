name: 自动打包 APK（签名注入）

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      - name: 生成图标
        run: |
          npm install @capacitor/assets
          npx capacitor-assets generate --iconBackgroundColor '#fdf8f0' --splashBackgroundColor '#fdf8f0'

      - name: 初始化 Capacitor
        run: |
          npx cap init 邻星 com.linxing.app --web-dir=www
          npx cap add android

      - name: 同步代码
        run: npx cap sync

      - name: 解码 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 构建 APK（签名注入）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 邻星安装包（带签名）
          path: android/app/build/outputs/apk/release/app-release.apk
