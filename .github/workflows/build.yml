name: 自动打包 APK（签名注入）

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      - name: 初始化 Capacitor 并添加安卓
        run: |
          npx cap init 邻星 com.linxing.app --web-dir=www
          npx cap add android

      # -------- 生成自定义图标（复制到 assets/） --------
      - name: 生成自定义图标
        run: |
          echo "🔍 检查 resources/icon.png 是否存在..."
          if [ -f "resources/icon.png" ]; then
            echo "✅ 找到 resources/icon.png，准备生成图标..."
            mkdir -p assets
            cp resources/icon.png assets/icon.png
            npm install @capacitor/assets
            npx capacitor-assets generate --iconBackgroundColor '#fdf8f0' --splashBackgroundColor '#fdf8f0'
            echo "📂 生成的 Android 图标文件夹："
            ls -la android/app/src/main/res/mipmap-* || echo "（请检查图片尺寸是否为 1024x1024）"
          else
            echo "❌ 未找到 resources/icon.png，将使用 Capacitor 默认图标。"
          fi

      - name: 同步代码
        run: npx cap sync

      - name: 解码 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 构建 APK（签名注入）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 邻星安装包（带签名）
          path: android/app/build/outputs/apk/release/app-release.apk
